<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Anya</title>
    <style>
        body {
            background: #1a050a;
            color: #f8edeb;
            font-family: 'Georgia', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            transition: all 0.5s ease;
        }
        #fireworksCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            padding: 50px;
            border-radius: 20px;
            border: 2px solid #ff4d6d;
            width: 350px;
            box-shadow: 0 0 30px rgba(255, 77, 109, 0.3);
        }
        .icon { font-size: 80px; margin-bottom: 20px; transition: 0.5s; }
        h1 { margin: 0; color: #ff4d6d; letter-spacing: 4px; text-transform: uppercase; }
        p { font-size: 1.2rem; margin-top: 20px; }
        
        .btn-container { 
            margin-top: 40px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            height: 50px;
        }

        button {
            padding: 15px 30px;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.3s;
            position: absolute;
        }

        #yesBtn {
            background: #ff4d6d;
            color: white;
            transform: translateX(-70px);
            z-index: 100;
        }

        #noBtn {
            background: #4a4a4a;
            color: white;
            transform: translateX(70px);
        }

        .broken-heart {
            position: fixed;
            top: -50px;
            font-size: 20px;
            animation: fall linear forwards;
            z-index: 0;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body>

<canvas id="fireworksCanvas"></canvas>

<div class="card" id="mainCard">
    <div id="content">
        <div class="icon" id="mainIcon">❤️</div>
        <h1>ANYA</h1>
        <p id="mainText">My Love, will you be my Valentine?</p>
        <div class="btn-container">
            <button id="yesBtn" onclick="celebrate()">YES</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="rejected()">NO</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    // 1. THE DRAMATIC "NO" BUTTON MOVE
    function moveButton() {
        const noBtn = document.getElementById('noBtn');
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
        
        noBtn.style.position = 'fixed';
        noBtn.style.left = x + 'px';
        noBtn.style.top = y + 'px';
    }

    // 2. THE REJECTED SCENE
    function rejected() {
        document.body.style.filter = "grayscale(100%)";
        document.getElementById('mainIcon').innerHTML = "🧸💔";
        document.getElementById('mainText').innerHTML = "<b>TRY AGAIN ANYA...</b><br>You broke my heart!";
        document.getElementById('noBtn').style.display = "none";
        document.getElementById('yesBtn').style.transform = "translateX(0)";
        
        // Start raining broken hearts
        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('broken-heart');
            heart.innerHTML = '💔';
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 2 + 3 + "s";
            document.body.appendChild(heart);
        }, 300);
    }

    // 3. THE CELEBRATION SCENE
    function celebrate() {
        document.body.style.filter = "grayscale(0%)";
        document.body.style.background = "#4e0d1d";
        document.getElementById('content').innerHTML = `
            <div class="icon">💖</div>
            <h1>YAY!</h1>
            <p>I am the luckiest person in the world.<br>I love you, Anya!</p>
        `;
        setInterval(createParticle, 50);
        animate();
    }

    // Firework Logic
    function createParticle() {
        for(let i=0; i<5; i++) {
            particles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 5 + 2,
                color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                velocity: { x: (Math.random() - 0.5) * 8, y: (Math.random() - 0.5) * 8 },
                life: 1.0
            });
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        particles.forEach((p, i) => {
            p.x += p.velocity.x;
            p.y += p.velocity.y;
            p.life -= 0.02;
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            if(p.life <= 0) particles.splice(i, 1);
        });
        requestAnimationFrame(animate);
    }
</script>

</body>

</html>
